<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>QQ风格群聊 · 台球室</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase JS v2 (ESM CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <!-- ============ 模式选择 ============ -->
  <div id="modeSelector" class="mode-selector">
    <div class="mode-card">
      <div class="mode-logo">🎱</div>
      <h1>选择聊天模式</h1>
      <p class="mode-sub">台球室实时聊天系统</p>

      <div class="mode-options">
        <button class="mode-btn mode-lan" id="modeLanBtn">
          <span class="mode-icon">📡</span>
          <div class="mode-info">
            <div class="mode-title">台球室局域网</div>
            <div class="mode-desc">同一 WiFi 内免流量聊天，无需联网</div>
          </div>
        </button>

        <button class="mode-btn mode-cloud" id="modeCloudBtn">
          <span class="mode-icon">☁️</span>
          <div class="mode-info">
            <div class="mode-title">云端聊天室</div>
            <div class="mode-desc">Supabase 实时同步，随时随地聊天</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ 登录/设置昵称 模态框 ============ -->
  <div id="loginModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-logo">💬</div>
      <h2>加入聊天</h2>
      <p class="modal-sub">输入昵称，开始你的实时群聊之旅</p>
      <input id="nicknameInput" type="text" placeholder="你的昵称" maxlength="20" autocomplete="off" />
      <div class="color-picker" id="colorPicker">
        <span class="cp-label">选个头像颜色</span>
        <div class="cp-swatches" id="colorSwatches"></div>
      </div>
      <button id="joinBtn" class="btn-primary">进入聊天</button>
      <p class="modal-hint">提示：数据通过 Supabase Realtime 实时同步，刷新页面历史消息不丢失。</p>
    </div>
  </div>

  <!-- ============ 主布局 ============ -->
  <div id="app" class="app hidden">

    <!-- 移动端遮罩 -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- 频道/联系人列表 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="ws-title">实时聊天工作区</span>
        <span class="online-count" id="onlineCount">0 在线</span>
      </div>

      <div class="sidebar-section">
        <div class="section-label">频道</div>
        <ul class="channel-list" id="channelList"></ul>
      </div>

      <div class="sidebar-section">
        <div class="section-label">在线成员</div>
        <ul class="member-list" id="memberList"></ul>
      </div>

      <div class="sidebar-footer">
        <div class="me" id="meInfo">
          <div class="me-avatar" id="meAvatar">?</div>
          <div class="me-info">
            <div class="me-name" id="meName">—</div>
            <div class="me-status">● 在线</div>
          </div>
          <button class="me-edit-btn" id="meEditBtn" title="编辑个人资料">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 主聊天区 -->
    <main class="chat-main">
      <header class="chat-header">
        <div class="ch-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" title="菜单">☰</button>
          <span class="ch-hash" id="chHash">#</span>
          <span class="ch-name" id="chName">general</span>
          <span class="ch-desc" id="chDesc"></span>
        </div>
        <div class="ch-right">
          <span class="ch-members" id="chMembers">0 成员</span>
        </div>
      </header>

      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typingIndicator"></div>

      <footer class="composer">
        <div class="composer-inner">
          <button class="emoji-btn" id="emojiBtn" title="表情">😊</button>
          <textarea
            id="messageInput"
            class="message-input"
            rows="1"
            placeholder="在 #general 发送消息… (Enter 发送 / Shift+Enter 换行)"
          ></textarea>
          <button class="send-btn" id="sendBtn" title="发送">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M3 12L21 3L13 21L11 13L3 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="composer-hint" id="composerHint"></div>
      </footer>
    </main>
  </div>

  <!-- ============ 局域网聊天容器 ============ -->
  <div id="lanContainer" class="lan-container hidden"></div>

  <!-- 表情选择浮层 -->
  <div id="emojiPanel" class="emoji-panel hidden">
    <div class="ep-grid" id="emojiGrid"></div>
  </div>

  <!-- 消息右键反应浮层 -->
  <div id="reactionPicker" class="reaction-picker hidden">
    <div class="rp-grid" id="reactionGrid"></div>
  </div>

  <!-- 编辑个人资料模态框 -->
  <div id="profileModal" class="modal-overlay hidden">
    <div class="modal profile-modal">
      <div class="modal-logo" id="profilePreview">💬</div>
      <h2>编辑个人资料</h2>
      <p class="modal-sub">修改昵称和头像颜色</p>

      <label class="form-label">昵称</label>
      <input type="text" id="profileNickname" class="form-input" maxlength="20" placeholder="输入新昵称" />

      <label class="form-label">头像颜色</label>
      <div class="color-swatches" id="profileColors"></div>

      <div class="modal-actions">
        <button class="btn-secondary" id="profileCancel">取消</button>
        <button class="btn-primary" id="profileSave">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="lan-chat.js"></script>
</body>
</html>
